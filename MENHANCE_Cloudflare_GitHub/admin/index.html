<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MENHANCE 管理后台</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#071225;color:#edf7ff;font:15px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:35px auto}.muted{color:#9bb1c9}.panel{padding:22px;border:1px solid #24415e;border-radius:16px;background:#0b1b31;margin-top:20px}input,button{font:inherit;padding:12px 14px;border-radius:9px}input{width:100%;color:white;background:#071225;border:1px solid #38536e;margin:8px 0 14px}button{border:0;background:#68eaff;color:#03111f;font-weight:800;cursor:pointer}.secondary{color:white;background:#203851}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #24415e;white-space:nowrap}th{color:#9defff;font-size:13px}td{font-size:14px}.status{min-height:24px;color:#a5f3d5}.error{color:#ffb8b8}[hidden]{display:none!important}</style></head><body><main><h1>MENHANCE 咨询管理</h1><div class="muted">管理员专用 · 最近 200 条咨询记录</div><section class="panel" id="loginPanel"><h2>管理员登录</h2><form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" maxlength="512" required><button type="submit">登录后台</button></form><p id="loginStatus" class="status" role="status" aria-live="polite"></p></section><section class="panel" id="leadsPanel" hidden><div class="toolbar"><div><h2 style="margin:0">咨询列表</h2><div class="muted">仅显示客户主动提交的基本联系信息。</div></div><div><button id="refreshButton" type="button">刷新</button> <button id="logoutButton" type="button" class="secondary">退出登录</button></div></div><p id="listStatus" class="status" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>编号</th><th>提交时间（UTC）</th><th>咨询主题</th><th>称呼</th><th>联系方式</th><th>方便联系时间</th><th>处理状态</th></tr></thead><tbody id="leadsBody"></tbody></table></div></section></main><script>
const loginPanel=document.getElementById('loginPanel'),leadsPanel=document.getElementById('leadsPanel'),loginStatus=document.getElementById('loginStatus'),listStatus=document.getElementById('listStatus'),leadsBody=document.getElementById('leadsBody');
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'请求失败，请稍后重试。');return d}
async function loadLeads(){listStatus.textContent='正在加载…';listStatus.className='status';leadsBody.replaceChildren();try{const d=await api('/api/admin/leads',{method:'GET'});loginPanel.hidden=true;leadsPanel.hidden=false;if(!d.leads.length){listStatus.textContent='目前还没有咨询记录。';return}for(const lead of d.leads){const tr=document.createElement('tr');for(const v of [lead.id,lead.created_at,lead.topic,lead.name||'—',lead.contact,lead.preferred_time||'—',lead.status]){const td=document.createElement('td');td.textContent=String(v??'');tr.appendChild(td)}leadsBody.appendChild(tr)}listStatus.textContent=`共显示 ${d.leads.length} 条记录。`}catch(e){if(e.message.includes('로그인이 필요합니다')){loginPanel.hidden=false;leadsPanel.hidden=true;return}listStatus.textContent=e.message;listStatus.className='status error'}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='正在登录…';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('password').value='';await loadLeads()}catch(err){loginStatus.textContent=err.message;loginStatus.className='status error'}});
document.getElementById('refreshButton').addEventListener('click',loadLeads);document.getElementById('logoutButton').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'})}finally{leadsPanel.hidden=true;loginPanel.hidden=false;loginStatus.textContent='已退出登录。'}});loadLeads();
</script></body></html>
